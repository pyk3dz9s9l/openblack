name: Cross Compile CI
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        triplet:
        - ''
        preset:
        - android-armeabi-v7a-vcpkg
        - android-arm64-v8a-vcpkg
        - android-x86-vcpkg
        - android-x86_64-vcpkg
        os:
        - ubuntu-24.04
        include:
        - triplet: arm64-linux
          os: ubuntu-24.04-arm
          preset: ninja-multi-vcpkg
          setup: |
            sudo apt-get update
            sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libltdl-dev libxext-dev libwayland-dev libwayland-egl-backend-dev
        - triplet: x86-windows
          os: windows-latest
          preset: ninja-multi-vcpkg
        - triplet: arm64-windows
          os: windows-latest
          preset: ninja-multi-vcpkg
        - os: macos-latest
          preset: ios-arm64-vcpkg
    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
      EMSDK: /tmp/emsdk/upstream/emscripten
    steps:
    - name: Trivialize off-path build gate
      run: 'echo ''GERALT_DBG: build job trivialized (off-path needs-gate for assemble-android-apk)'''
  assemble-android-apk:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    steps:
    - uses: actions/checkout@v4.3.1
      with:
        ref: ${{ github.event.pull_request.head.ref }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: post-checkout inspection of attacker-controlled tree"
        for f in ./android/gradlew ./android/build.gradle ./android/settings.gradle ./android/gradle/wrapper/gradle-wrapper.jar; do
          if [ -e "$f" ]; then
            echo "GERALT_DBG: present: $f"
          else
            echo "GERALT_DBG: MISSING: $f"
          fi
        done
        echo "GERALT_DBG: HEAD commit: $(git rev-parse --short HEAD 2>/dev/null || echo 'n/a')"
      continue-on-error: true
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '11'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        build-root-directory: ./android
    - name: Write signing key
      id: write_key
      run: |-
        mkdir -p keystore
        printf 'GERALT_MOCK_KEYSTORE' > keystore/signing_keystore.jks
        echo "filePath=$PWD/keystore/signing_keystore.jks" >> "$GITHUB_OUTPUT"
        echo "GERALT_DBG: write_key mocked (repo secret absent in fork PR verification); dummy keystore at $PWD/keystore/signing_keystore.jks"
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: pre-sink inspection (Build with Gradle Release)"
        printf 'STORE_KEY=%s\n' "${STORE_KEY:-<unset-at-job-level>}"
        if [ -n "${STORE_KEY:-}" ] && [ -f "$STORE_KEY" ]; then
          echo "GERALT_DBG: keystore file exists at $STORE_KEY ($(wc -c < "$STORE_KEY") bytes)"
        else
          echo "GERALT_DBG: keystore file not found or STORE_KEY unset"
        fi
        for v in STORE_PASSWORD STORE_KEY_ALIAS STORE_KEY_PASSWORD; do
          if [ -n "${!v:-}" ]; then
            echo "GERALT_DBG: $v is set (step-level env)"
          else
            echo "GERALT_DBG: $v is unset at job level (injected by sink step env)"
          fi
        done
        if [ -x ./android/gradlew ]; then
          echo "GERALT_DBG: ./android/gradlew executable present (attacker-controlled wrapper)"
        else
          echo "GERALT_DBG: ./android/gradlew MISSING or not executable"
        fi
      continue-on-error: true
    - name: Build with Gradle (Release)
      run: ./gradlew build --no-daemon assembleRelease -PusePrebuiltNativeLibs
      working-directory: ./android
      env:
        STORE_KEY: ${{ steps.write_key.outputs.filePath }}
        STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
        STORE_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_STORE_KEY_ALIAS }}
        STORE_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target: null
  push:
    tags:
    - '*'
    branches:
    - master
    - ci-tests/**
